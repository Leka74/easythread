name: Bug Report
description: Report a bug or issue with easythread
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below to help us investigate.

  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package is affected?
      options:
        - "@easythread/core"
        - "@easythread/vite"
        - "@easythread/rollup" 
        - "@easythread/esbuild"
        - "Examples"
        - "Documentation"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: What environment are you using?
      options:
        - "Browser (Web Workers)"
        - "Node.js (Worker Threads)"
        - "Both"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Create a function with '/** @easythread */'
        2. Call the function
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code Example
      description: Please provide a minimal code example that reproduces the issue
      render: typescript
    validations:
      required: false

  - type: textarea
    id: environment-info
    attributes:
      label: Environment Information
      description: |
        Please provide version information:
      placeholder: |
        - Node.js version:
        - Package version:
        - Bundler (Vite/Rollup/ESBuild):
        - OS:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs
      description: Please paste any error logs or stack traces
      render: shell